name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v6.0.2

    - name: Checkout host source
      uses: actions/checkout@v6.0.2
      with:
        repository: InkCanvasForClass/community
        # 固定宿主发布版本：本分支面向 v1.7.19.9（SDK 无新接口，
        # 插件代码已按该 SDK 降级）；main 分支 SDK 含新接口，不能直接混用。
        ref: '1.7.19.9'
        path: community

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '6.0.x'

    # 本插件 TFM 为 net6.0-windows（对齐上游社区仓库的 net6.0 目标；
    # EdgeTTS 在线引擎在 net6 下未打包，依赖其的 EdgeTTS.DotNet 无 net6 目标）。
    # 宿主 SDK/控件显式按 net6.0 重新构建，产物路径与插件 HintPath 对齐。
    # 注意：隐式 restore 不保证继承命令行 TFM 覆盖，必须显式 restore。
    - name: Build host SDK & controls (net6.0)
      shell: pwsh
      run: |
        $tfm = "net6.0-windows10.0.19041.0"
        dotnet restore community/InkCanvas.PluginSdk/InkCanvas.PluginSdk.csproj -p:TargetFramework=$tfm
        dotnet build community/InkCanvas.PluginSdk/InkCanvas.PluginSdk.csproj --configuration Release --no-restore -p:TargetFramework=$tfm
        dotnet restore community/InkCanvas.Controls/InkCanvas.Controls.csproj -p:TargetFramework=$tfm
        dotnet build community/InkCanvas.Controls/InkCanvas.Controls.csproj --configuration Release --no-restore -p:TargetFramework=$tfm

    - name: Build plugin
      shell: pwsh
      run: |
        dotnet build VoicePlugin.csproj --configuration Release -p:PluginSdkRoot=community

    - name: Package .icpx
      shell: pwsh
      run: |
        $pluginId = (Get-Content "bin/Release/net6.0-windows10.0.19041.0/manifest.json" | ConvertFrom-Json).Id
        New-Item -ItemType Directory -Path packages -Force | Out-Null
        Copy-Item "icpx/VoicePlugin.icpx" "packages/$pluginId.icpx" -Force
        Write-Host "Packaged packages/$pluginId.icpx"

    - name: Create Release
      # gh 在 Actions 环境中必须显式提供 GH_TOKEN，否则直接报错退出。
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $pluginId = (Get-Content "bin/Release/net6.0-windows10.0.19041.0/manifest.json" | ConvertFrom-Json).Id
        $tag = "${{ inputs.tag || github.ref_name }}"
        # 显式传入资产路径（不用通配符），说明文字用静态 notes。
        gh release create "$tag" "packages/$pluginId.icpx" --repo $env:GITHUB_REPOSITORY --title "$tag" --notes "Voice 插件自动构建包 ($tag)"
