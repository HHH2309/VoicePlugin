name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '10.0.x'

    # InkCanvas.PluginSdk / InkCanvas.Controls 由 NuGet 提供（已是
    # net10.0-windows 目标），无需再检出并重编宿主源码。
    - name: Build plugin
      shell: pwsh
      run: |
        dotnet build VoicePlugin.csproj --configuration Release

    - name: Package .icpx
      shell: pwsh
      run: |
        $pluginId = (Get-Content "bin/Release/net10.0-windows10.0.19041.0/manifest.json" | ConvertFrom-Json).Id
        New-Item -ItemType Directory -Path packages -Force | Out-Null
        Copy-Item "icpx/VoicePlugin.icpx" "packages/$pluginId.icpx" -Force
        Write-Host "Packaged packages/$pluginId.icpx"

    - name: Create Release
      # gh 在 Actions 环境中必须显式提供 GH_TOKEN，否则直接报错退出。
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $pluginId = (Get-Content "bin/Release/net10.0-windows10.0.19041.0/manifest.json" | ConvertFrom-Json).Id
        $tag = "${{ inputs.tag || github.ref_name }}"
        # 显式传入资产路径（不用通配符），说明文字用静态 notes。
        gh release create "$tag" "packages/$pluginId.icpx" --repo $env:GITHUB_REPOSITORY --title "$tag" --notes "Voice 插件自动构建包 ($tag)"
