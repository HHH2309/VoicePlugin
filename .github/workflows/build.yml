name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '10.0.x'

    # InkCanvas.PluginSdk / InkCanvas.Controls 由 NuGet 提供（已是
    # net10.0-windows 目标），无需再检出并重编宿主源码。
    - name: Build plugin
      shell: pwsh
      run: |
        dotnet build VoicePlugin.csproj --configuration Release

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: VoicePlugin
        path: icpx/VoicePlugin.icpx
