name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v4

    - name: Checkout host source
      uses: actions/checkout@v4
      with:
        repository: InkCanvasForClass/community
        path: community

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build host SDK & controls
      shell: pwsh
      run: |
        dotnet build community/InkCanvas.PluginSdk/InkCanvas.PluginSdk.csproj --configuration Release
        dotnet build community/InkCanvas.Controls/InkCanvas.Controls.csproj --configuration Release

    - name: Build plugin
      shell: pwsh
      run: |
        dotnet build VoicePlugin.csproj --configuration Release -p:PluginSdkRoot=../community

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoicePlugin
        path: icpx/VoicePlugin.icpx
